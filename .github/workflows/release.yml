name: Build installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infraspace-installer
  cancel-in-progress: false

jobs:
  installer:
    # Requires the installed game assemblies. Run only trusted main-branch code
    # on this machine; no pull_request trigger executes external submissions.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, infraspace]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Choose build version
        id: version
        run: |
          $base = [version](Get-Content config.json -Raw | ConvertFrom-Json).version
          $version = '{0}.{1}.{2}' -f $base.Major, $base.Minor, ($base.Build + [int]$env:GITHUB_RUN_NUMBER)
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and test installer
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          MANAGED_DIR: ${{ vars.INFRASPACE_MANAGED_DIR }}
          HARMONY_PATH: ${{ vars.INFRASPACE_HARMONY_PATH }}
        run: |
          if (!$env:HARMONY_PATH) { throw 'Set repository variable INFRASPACE_HARMONY_PATH to the runner ISModKit 0Harmony.dll.' }
          $parameters = @{ Version = $env:BUILD_VERSION; HarmonyPath = $env:HARMONY_PATH }
          if ($env:MANAGED_DIR) { $parameters.ManagedDir = $env:MANAGED_DIR }
          ./release.ps1 @parameters

      - name: Upload installer package
        uses: actions/upload-artifact@v7
        with:
          name: InfraSpaceQoL-${{ steps.version.outputs.version }}-installer
          if-no-files-found: error
          retention-days: 90
          path: |
            installer/bin/Release/InfraSpaceQoLInstaller.exe
            installer/bin/Release/InfraSpaceQoL.dll
            installer/bin/Release/0Harmony.dll
            installer/bin/Release/config.json
            installer/bin/Release/settings.json

      - name: Summarize
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          "Installer **$env:BUILD_VERSION** built and tested. Download the installer artifact from this run; keep all five files together and run InfraSpaceQoLInstaller.exe." >> $env:GITHUB_STEP_SUMMARY
          "Game reference assemblies are not included. No generated binaries or version commits are pushed to the repository." >> $env:GITHUB_STEP_SUMMARY
